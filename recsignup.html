<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Recruiter Signup</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
      }

      .signup-container {
        width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: #fff;
        border: 1px solid #ccc;
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
      }

      .signup-container h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .signup-container label {
        display: block;
        margin: 10px 0 5px;
        font-size: 14px;
      }

      .signup-container input[type="text"],
      .signup-container input[type="email"],
      .signup-container input[type="password"],
      .signup-container input[type="tel"],
      .signup-container input[type="url"] {
        width: 100%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #aaa;
        box-sizing: border-box;
      }

      .signup-container button {
        width: 100%;
        padding: 10px;
        background-color: #e67e22;
        color: white;
        border: none;
        cursor: pointer;
        font-size: 16px;
      }

      .signup-container button:hover {
        background-color: #d35400;
      }

      .signup-container p {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
      }

      .signup-container a {
        text-decoration: none;
        color: #2980b9;
      }

      .signup-container a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="signup-container">
      <h2>Recruiter Signup</h2>
      <form>
        <label for="company">Company Name</label>
        <input
          type="text"
          id="company"
          name="company"
          placeholder="Enter company name"
        />

        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your full name"
        />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email" />

        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter phone number"
        />

        <label for="website">Company Website</label>
        <input
          type="url"
          id="website"
          name="website"
          placeholder="https://example.com"
        />

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter password"
        />

        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          placeholder="Re-enter password"
        />

        <button type="submit" onclick="">Sign Up</button>

        <p>
          Already have an account? <a href="recruitlogin.html">Login here</a>
        </p>
      </form>
    </div>
  </body>
</html>
